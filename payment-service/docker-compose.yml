services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: payment-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: payment-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  payment-db:
    image: mysql:8.0
    container_name: payment-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: payments_db
      MYSQL_USER: payment_user
      MYSQL_PASSWORD: payment_pass
    ports:
      - "3308:3306"
    volumes:
      - payment_mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-payment.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upayment_user", "-ppayment_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      BAL_CONFIG_VAR_DBHOST: payment-db
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_DBUSER: payment_user
      BAL_CONFIG_VAR_DBPASSWORD: payment_pass
      BAL_CONFIG_VAR_DBNAME: payments_db
      BAL_CONFIG_VAR_KAFKABROKER: kafka:29092
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  payment_mysql_data:
