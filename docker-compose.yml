services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - food-net


  admin-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: admin_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - admin_mysql_data:/var/lib/mysql
    networks:
      - food-net

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uadmin",
          "-padmin"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  admin-service:
    build: ./admin-service
    ports:
      - "9096:9096"

    environment:
      BAL_CONFIG_VAR_DBHOST: admin-db
      BAL_CONFIG_VAR_KAFKAURL: kafka:29092


  food-delivery-db:
    image: mysql:8.0
    container_name: food-delivery-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: food_delivery
      MYSQL_USER: foodapp
      MYSQL_PASSWORD: foodpass
    volumes:
      - food-delivery-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

      
    depends_on:
      admin-db:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - food-net


  delivery-db:
    image: mysql:8.0

    command:
      - --default-authentication-plugin=mysql_native_password

    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: delivery_db
      MYSQL_USER: delivery
      MYSQL_PASSWORD: delivery

    volumes:
      - delivery_mysql_data:/var/lib/mysql
      - ./delivery-service/db/init.sql:/docker-entrypoint-initdb.d/01-delivery.sql:ro

    networks:
      - food-net

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-prootpw"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  delivery-service:
    build: ./delivery-service

    ports:
      - "8085:8085"

    environment:
      dbHost: delivery-db
      dbPort: 3306
      dbUser: delivery
      dbPassword: delivery
      dbName: delivery_db
      kafkaBroker: kafka:29092

    depends_on:
      delivery-db:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - food-net


volumes:
  admin_mysql_data:
  delivery_mysql_data:
  food-delivery-data:


networks:
  food-net:
    driver: bridge
