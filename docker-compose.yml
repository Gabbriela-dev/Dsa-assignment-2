services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [food-net]

  food-delivery-db:
    image: mysql:8.0
    container_name: food-delivery-db
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: food_delivery
      MYSQL_USER: foodapp
      MYSQL_PASSWORD: foodpass
    volumes:
      - food-delivery-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [food-net]

  customer-service:
    build: ./customer-service
    ports: ["8081:8081"]
    environment:
      BAL_CONFIG_VAR_DBHOST: food-delivery-db
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_DBUSER: foodapp
      BAL_CONFIG_VAR_DBPASSWORD: foodpass
      BAL_CONFIG_VAR_DBNAME: food_delivery
    depends_on:
      food-delivery-db: {condition: service_healthy}
    networks: [food-net]

  restaurant-service:
    build: ./restaurant-service
    ports: ["8082:8082"]
    environment:
      BAL_CONFIG_VAR_DBHOST: food-delivery-db
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_DBUSER: foodapp
      BAL_CONFIG_VAR_DBPASSWORD: foodpass
      BAL_CONFIG_VAR_DBNAME: food_delivery
      BAL_CONFIG_VAR_KAFKAURL: kafka:29092
    depends_on:
      food-delivery-db: {condition: service_healthy}
      kafka: {condition: service_started}
    networks: [food-net]

  order-service:
    build: ./order-service
    ports: ["8083:8083"]
    environment:
      BAL_CONFIG_VAR_DBHOST: food-delivery-db
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_DBUSER: foodapp
      BAL_CONFIG_VAR_DBPASSWORD: foodpass
      BAL_CONFIG_VAR_DBNAME: food_delivery
      BAL_CONFIG_VAR_KAFKAURL: kafka:29092
    depends_on:
      food-delivery-db: {condition: service_healthy}
      kafka: {condition: service_started}
    networks: [food-net]

  admin-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: admin_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports: ["3306:3306"]
    volumes: [admin_mysql_data:/var/lib/mysql]
    networks: [food-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 10

  admin-service:
    build: ./admin-service
    ports: ["9096:9096"]
    environment:
      BAL_CONFIG_VAR_DBHOST: admin-db
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_DBUSER: admin
      BAL_CONFIG_VAR_DBPASSWORD: admin
      BAL_CONFIG_VAR_DBNAME: admin_db
      BAL_CONFIG_VAR_KAFKAURL: kafka:29092
    depends_on:
      admin-db: {condition: service_healthy}
      kafka: {condition: service_started}
    networks: [food-net]

  payment-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: payments_db
      MYSQL_USER: payment_user
      MYSQL_PASSWORD: payment_pass
    ports: ["3308:3306"]
    volumes:
      - payment_mysql_data:/var/lib/mysql
      - ./payment-service/db/init.sql:/docker-entrypoint-initdb.d/01-payment.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upayment_user", "-ppayment_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [food-net]

  payment-service:
    build: ./payment-service
    ports: ["8080:8080"]
    environment:
      BAL_CONFIG_VAR_DBHOST: payment-db
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_DBUSER: payment_user
      BAL_CONFIG_VAR_DBPASSWORD: payment_pass
      BAL_CONFIG_VAR_DBNAME: payments_db
      BAL_CONFIG_VAR_KAFKABROKER: kafka:29092
    depends_on:
      payment-db: {condition: service_healthy}
      kafka: {condition: service_started}
    networks: [food-net]

  notification-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: notification_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [food-net]

  notification-service:
    build: ./notification-service
    ports: ["8086:8085"]
    environment:
      BAL_CONFIG_VAR_DBHOST: notification-db
      BAL_CONFIG_VAR_DBPORT: 3306
      BAL_CONFIG_VAR_DBUSER: root
      BAL_CONFIG_VAR_DBPASSWORD: rootpass
      BAL_CONFIG_VAR_DBNAME: notification_db
      BAL_CONFIG_VAR_KAFKAURL: kafka:29092
    depends_on:
      notification-db: {condition: service_healthy}
      kafka: {condition: service_started}
    networks: [food-net]

  delivery-db:
    image: mysql:8.0
    command: [--default-authentication-plugin=mysql_native_password]
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: delivery_db
      MYSQL_USER: delivery
      MYSQL_PASSWORD: delivery
    volumes:
      - delivery_mysql_data:/var/lib/mysql
      - ./delivery-service/db/init.sql:/docker-entrypoint-initdb.d/01-delivery.sql:ro
    networks: [food-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 10

  delivery-service:
    build: ./delivery-service
    ports: ["8085:8085"]
    environment:
      dbHost: delivery-db
      dbPort: 3306
      dbUser: delivery
      dbPassword: delivery
      dbName: delivery_db
      kafkaBroker: kafka:29092
    depends_on:
      delivery-db: {condition: service_healthy}
      kafka: {condition: service_started}
    networks: [food-net]

volumes:
  admin_mysql_data:
  delivery_mysql_data:
  payment_mysql_data:
  food-delivery-data:

networks:
  food-net:
    driver: bridge
