# Add these two services to the group's root docker-compose.yml, under "services:".
# The Kafka service is already there; kafka:29092 is its internal address.

  notification-db:
    image: mysql:8.0
    container_name: notification-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: notification_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_started
      notification-db:
        condition: service_healthy
    restart: on-failure
    environment:
      BAL_CONFIG_VAR_DBHOST: notification-db
      BAL_CONFIG_VAR_KAFKAURL: kafka:29092
